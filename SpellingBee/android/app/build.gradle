apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def resolvedSigning = [
    storeFile: keystoreProperties['storeFile'] ?: System.getenv('WORDSPRINT_UPLOAD_STORE_FILE'),
    storePassword: keystoreProperties['storePassword'] ?: System.getenv('WORDSPRINT_UPLOAD_STORE_PASSWORD'),
    keyAlias: keystoreProperties['keyAlias'] ?: System.getenv('WORDSPRINT_UPLOAD_KEY_ALIAS'),
    keyPassword: keystoreProperties['keyPassword'] ?: System.getenv('WORDSPRINT_UPLOAD_KEY_PASSWORD'),
]
def requiredSigningProperties = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def missingSigningProperties = requiredSigningProperties.findAll { name ->
    def value = resolvedSigning[name]
    value == null || value.toString().trim().isEmpty()
}
def hasReleaseSigning = missingSigningProperties.isEmpty()

android {
    namespace = "com.wordsprint.bilingual"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.wordsprint.bilingual"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(resolvedSigning.storeFile)
                storePassword resolvedSigning.storePassword
                keyAlias resolvedSigning.keyAlias
                keyPassword resolvedSigning.keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

tasks.configureEach { task ->
    if (task.name.toLowerCase().contains('release')) {
        task.doFirst {
            if (!missingSigningProperties.isEmpty()) {
                throw new GradleException("Release signing failed. Missing properties: ${missingSigningProperties.join(', ')}. Set them in android/keystore.properties (see android/keystore.properties.example) or WORDSPRINT_UPLOAD_STORE_FILE, WORDSPRINT_UPLOAD_STORE_PASSWORD, WORDSPRINT_UPLOAD_KEY_ALIAS, and WORDSPRINT_UPLOAD_KEY_PASSWORD.")
            }
        }
    }
}
