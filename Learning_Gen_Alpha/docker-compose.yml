services:
  postgres:
    image: postgres:16-alpine
    container_name: game_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: game_db
    ports:
      - "4010:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: game_redis
    ports:
      - "4011:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
